[project]
name = "muschat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.0.0",
    "httpx2>=2.16.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.67.0",
    "verovio>=6.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# google-genai 3.0.0 tem "\/" inválido em docstrings de types.py (ruído do SDK, não nosso)
filterwarnings = ["ignore::SyntaxWarning"]
